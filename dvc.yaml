stages:
  fetch_data:
    cmd: poetry run python hotel_reservation/src/data/fetch_data.py hotel_reservation/data/raw/raw_data.csv
    outs:
    - hotel_reservation/data/raw/raw_data.csv

  prepare_data:
    cmd: python hotel_reservation/src/data/prepare.py hotel_reservation/data/raw/raw_data.csv
      hotel_reservation/data/processed/
    deps:
    - hotel_reservation/data/raw/raw_data.csv
    - hotel_reservation/src/data/prepare.py
    params:
    - split_criterion.seed
    - split_criterion.train_split
    - model_features.encode_features
    outs:
    - hotel_reservation/data/processed/train.csv
    - hotel_reservation/data/processed/test.csv

  train:
    cmd: python hotel_reservation/src/model/train.py hotel_reservation/data/processed/train.csv
      hotel_reservation/models
    deps:
    - hotel_reservation/data/processed/train.csv
    - hotel_reservation/src/model/train.py
    params:
    - model_features.random_state
    - model_features.stopping_rounds
    - model_features.eval_metric
    - hyperparameters.trials
    outs:
    - hotel_reservation/models/model.joblib
    - mlruns/current_run_id.txt

  evaluate:
    cmd: python hotel_reservation/src/model/evaluate.py hotel_reservation/models/model.joblib
      hotel_reservation/data/processed/test.csv
    deps:
    - hotel_reservation/data/processed/test.csv
    - hotel_reservation/src/model/evaluate.py
    - hotel_reservation/models/model.joblib
    - mlruns/current_run_id.txt
artifacts:
  model:
    path: hotel_reservation/models/model.joblib
    type: model
metrics:
- dvclive/metrics.json
plots:
- dvclive/plots/metrics:
    x: step
